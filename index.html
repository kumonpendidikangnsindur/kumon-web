<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Kumon Pendidikan - Gunung Sindur 🎈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Fredoka', sans-serif; background: linear-gradient(135deg, #E0F2FE 0%, #FCE7F3 100%); min-height: 100vh; }
        .card-cute { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 4px solid #BAE6FD; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); }
    </style>
</head>
<body class="p-3 sm:p-6 text-slate-700">
<header class="text-center my-4">
    <div class="inline-block bg-white px-6 py-3 rounded-full shadow-md border-2 border-sky-200 mb-2">
        <h1 class="text-2xl sm:text-3xl font-bold text-sky-500 flex items-center justify-center gap-2"><span>✨</span> Kumon Pendidikan - Gunung Sindur <span>✨</span></h1>
    </div>
    <p class="text-sky-600 font-semibold text-sm sm:text-base">Sistem Absensi & Pembayaran Realtime 🌸</p>
</header>
<div class="flex justify-center flex-wrap gap-2 mb-6">
    <button onclick="switchTab('assistant')" class="bg-sky-400 hover:bg-sky-500 text-white font-bold py-2.5 px-4 rounded-2xl shadow-md transition text-sm">👩‍🏫 Assistant</button>
    <button onclick="switchTab('siswa')" class="bg-pink-400 hover:bg-pink-500 text-white font-bold py-2.5 px-4 rounded-2xl shadow-md transition text-sm">🎒 Siswa (QR)</button>
    <button onclick="switchTab('payment')" class="bg-emerald-400 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded-2xl shadow-md transition text-sm">💳 Payment</button>
    <button onclick="switchTab('owner')" class="bg-purple-400 hover:bg-purple-500 text-white font-bold py-2.5 px-4 rounded-2xl shadow-md transition text-sm">👑 Instructor</button>
</div>
<div id="tab-assistant" class="tab-content max-w-md mx-auto card-cute p-6 rounded-3xl"> ... isi tab kamu sama seperti sebelumnya ... </div>
<div id="tab-siswa" class="tab-content hidden max-w-md mx-auto card-cute p-6 rounded-3xl text-center border-pink-200"> ... </div>
<div id="tab-payment" class="tab-content hidden max-w-5xl mx-auto card-cute p-6 rounded-3xl border-emerald-200"> ... </div>
<div id="tab-owner" class="tab-content hidden max-w-4xl mx-auto card-cute p-6 rounded-3xl border-purple-200"> ... </div>

<script>
   const firebaseConfig = {
    apiKey: "AIzaSyCeOv9ML5JIMNZ9cID5vUZmWSW_WVHI5tI",
    authDomain: "kumon-pendidikan-gunung-sindur.firebaseapp.com",
    databaseURL: "https://kumon-pendidikan-gunung-sindur-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "kumon-pendidikan-gunung-sindur",
    storageBucket: "kumon-pendidikan-gunung-sindur.firebasestorage.app",
    messagingSenderId: "915307579186",
    appId: "1:915307579186:web:6a3389b7c316abed4b792b"
};

    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database();
    let db = { assistants: [], siswa: [], pins: { payment: "5555", owner: "8888" }, absensiAst: [], absensiSiswa: [] };
    let currentAst = null; let html5QrcodeScanner = null; let isOwnerUnlocked = false; let isPaymentUnlocked = false;

    dbRef.ref('kumon_data').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            db.assistants = data.assistants || []; db.siswa = data.siswa || [];
            db.pins = data.pins || { payment: "5555", owner: "8888" };
            db.absensiAst = data.absensiAst || []; db.absensiSiswa = data.absensiSiswa || [];
        } else { saveDB(); }
        renderAssistantOptions(); renderLists(); renderPaymentTable(); if (currentAst) updateAssistantUI();
    });

    function saveDB() { dbRef.ref('kumon_data').set(db); }
    setInterval(() => { const now = new Date(); const clockEl = document.getElementById('clock'); if(clockEl) clockEl.innerText = now.toLocaleTimeString('id-ID'); }, 1000);

    // ... semua function kamu dari switchTab sampai renderLists TARUH DI SINI SAMA ...
    // PAKE KODE LENGKAP KAMU SEBELUMNYA

    function exportExcel(type) {
        let data = [];
        if (type === 'assistant') data = db.absensiAst;
        else if (type === 'siswa') data = db.absensiSiswa;
        else if (type === 'payment') data = db.siswa.map(s => ({
            ID: s.id, Nama: s.name, Kelas: s.kelas || '-',
            Subject: Array.isArray(s.subject) ? s.subject.join(", ") : (s.subject || '-'),
            Total_SPP: s.totalPayment || 0, Tgl_Bayar: s.payDate || '-',
            Phone: s.phone || '-', Status: s.status || 'UNPAID'
        }));
        if (data.length === 0) return alert("Belum ada data untuk di-export!");
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, type.toUpperCase());
        XLSX.writeFile(wb, `Data_${type}_Kumon.xlsx`);
    } // <--- HANYA 1 KALI SAJA, DI DALAM SCRIPT
</script>
</body>
</html>
